global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8000"]
        labels:
          service: "auth-service"

  - job_name: "orders-service"
    static_configs:
      - targets: ["orders-service:8000"]
        labels:
          service: "orders-service"

  - job_name: "payments-service"
    static_configs:
      - targets: ["payments-service:8000"]
        labels:
          service: "payments-service"

  - job_name: "db-proxy-service"
    static_configs:
      - targets: ["db-proxy-service:8000"]
        labels:
          service: "db-proxy-service"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
